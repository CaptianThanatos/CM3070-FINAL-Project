  # CONTINUOUS runtime only: timer must finish while pump command is still ON.
  - id: hush_zone_1_continuous_runtime_limit
    alias: HUSH - Zone 1 Continuous Runtime Flood Limiter
    mode: single
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.hush_zone_1_continuous_runtime
    conditions:
      - condition: state
        entity_id: input_boolean.pump_1_active
        state: "on"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hush_zone_1_latched_fault
      - action: input_text.set_value
        target:
          entity_id: input_text.hush_zone_1_fault_reason
        data:
          value: CONTINUOUS_RUNTIME_LIMIT
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.pump_1_active
      - action: persistent_notification.create
        data:
          notification_id: hush_zone_1_runtime_limit
          title: HUSH Zone 1 Flood Exposure Limiter
          message: >
            Pump 1 remained continuously ON for the configured maximum continuous runtime.
            It was stopped and latched for manual inspection.

