                    data:
                      value: WATERING_NO_RESPONSE
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.pump_2_active
                  - action: persistent_notification.create
                    data:
                      notification_id: hush_zone_2_no_response
                      title: HUSH Zone 2 Watering Fault
                      message: >
