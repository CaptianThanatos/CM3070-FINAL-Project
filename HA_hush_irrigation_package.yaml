        default:
          - variables:
              new_failures: "{{ failures + 1 }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ new_failures >= failure_limit }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
